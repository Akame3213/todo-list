name: Build desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: portable
          - os: ubuntu-24.04
            platform: linux
            target: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package unsigned application
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} -c.win.signExecutable=false --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: focus-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          test "${#files[@]}" -gt 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag --title "Фокус $RELEASE_TAG" \
              --notes-file docs/release-notes.md
          fi
